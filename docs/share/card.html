<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Contrast Lab share card</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@500;600&family=Work+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* 1200x630 share card. The right side is a real screenshot of the app (app.png, made by
         scripts/share-image.mjs), so the card always shows the actual interface. */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f4f4f5;
        color: #18181b;
        font-family: "Work Sans", sans-serif;
        display: grid;
        grid-template-columns: 400px 1fr;
      }
      .text {
        padding: 56px 28px 56px 56px;
        display: grid;
        align-content: center;
        gap: 22px;
      }
      .by {
        margin: 0;
        font-family: "Source Code Pro", monospace;
        font-weight: 600;
        font-size: 20px;
        color: #52525b;
      }
      h1 {
        margin: 0;
        font-size: 64px;
        line-height: 1;
        letter-spacing: -0.03em;
      }
      .tag {
        margin: 0;
        font-size: 26px;
        line-height: 1.3;
        color: #3f3f46;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 10px;
        font-size: 20px;
        font-weight: 600;
      }
      li {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      li::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #18181b;
        flex: none;
      }
      .shot {
        position: relative;
        overflow: hidden;
      }
      .shot img {
        position: absolute;
        top: 48px;
        left: 0;
        width: 840px;
        border-radius: 16px 0 0 16px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.18);
      }
    </style>
  </head>
  <body>
    <div class="text">
      <p class="by">jayfox.design/lab</p>
      <h1>Contrast Lab</h1>
      <p class="tag">Not just a fail: the nearest colors that pass.</p>
      <ul>
        <li>WCAG 2.2 checks, with the math</li>
        <li>Box text or an icon in a screenshot</li>
        <li>Check a whole palette at once</li>
      </ul>
    </div>
    <div class="shot"><img src="app.png" alt="" /></div>
  </body>
</html>
